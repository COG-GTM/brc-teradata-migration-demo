name: 'healthcare_claims_consolidated'
version: '1.0.0'
config-version: 2
profile: 'healthcare_claims_consolidated'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  healthcare_claims_consolidated:
    staging:
      teradata:
        +materialized: view
        +schema: stg_teradata
        +tags: ['staging', 'teradata']
      databricks:
        +materialized: view
        +schema: stg_databricks
        +tags: ['staging', 'databricks']
      snowflake:
        +materialized: view
        +schema: stg_snowflake
        +tags: ['staging', 'snowflake']
    intermediate:
      +materialized: ephemeral
      +tags: ['intermediate']
    input_layer:
      +materialized: table
      +schema: input_layer
      +tags: ['input_layer', 'tuva']
    marts:
      finance:
        +materialized: table
        +schema: finance
        +tags: ['finance', 'mart']
      risk:
        +materialized: table
        +schema: risk
        +tags: ['risk', 'mart']
      compliance:
        +materialized: table
        +schema: compliance
        +tags: ['compliance', 'mart']

seeds:
  healthcare_claims_consolidated:
    +schema: seeds
    raw_sources:
      +schema: raw
      customer:
        +column_types:
          customer_id: varchar(10)
          date_of_birth: date
          onboarding_date: date
      account:
        +column_types:
          account_id: varchar(10)
          customer_id: varchar(10)
          open_date: date
          close_date: date
      transaction:
        +column_types:
          transaction_id: varchar(10)
          account_id: varchar(10)
          transaction_date: date
          amount: numeric(18,2)
          counterparty_id: varchar(10)
      market_data:
        +column_types:
          valuation_date: date
          mid_price: numeric(18,8)
          bid_price: numeric(18,8)
          ask_price: numeric(18,8)
      counterparty:
        +column_types:
          counterparty_id: varchar(10)
          is_sanctions_listed: boolean
          is_pep: boolean

snapshots:
  healthcare_claims_consolidated:
    +target_schema: snapshots

vars:
  # Default business date for development/testing
  business_date: "current_date"
  # Toggle between Snowflake and Databricks syntax where needed
  target_platform: "snowflake"  # or "databricks"
  # Tuva configuration
  claims_enabled: true
  clinical_enabled: false
  # Data source identifier for Tuva input layer
  data_source: "consolidated_claims"
