name: dbt CI

on:
  pull_request:
    paths:
      - 'dbt_project/**'
      - 'sample_data/**'
      - '.github/workflows/dbt_ci.yml'
  push:
    branches:
      - main
    paths:
      - 'dbt_project/**'
      - 'sample_data/**'
      - '.github/workflows/dbt_ci.yml'

jobs:
  dbt-build:
    name: dbt build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: dbt_user
          POSTGRES_PASSWORD: dbt_password
          POSTGRES_DB: barclays_migration
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_RAW_DATABASE: barclays_migration
      DBT_RAW_SCHEMA: public_raw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-postgres dbt-core

      - name: Create profiles.yml for CI
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'PROFILES_EOF'
          barclays_migration:
            target: postgres_ci
            outputs:
              postgres_ci:
                type: postgres
                host: localhost
                port: 5432
                user: dbt_user
                password: dbt_password
                dbname: barclays_migration
                schema: public
                threads: 4
          PROFILES_EOF
          sed -i 's/^          //' ~/.dbt/profiles.yml

      - name: Create raw schema and load sample data
        env:
          PGPASSWORD: dbt_password
        run: |
          psql -h localhost -U dbt_user -d barclays_migration -c "CREATE SCHEMA IF NOT EXISTS raw;"
          psql -h localhost -U dbt_user -d barclays_migration -c "
            CREATE TABLE raw.customer (
              customer_id VARCHAR(20) PRIMARY KEY,
              first_name VARCHAR(100),
              last_name VARCHAR(100),
              date_of_birth DATE,
              nationality VARCHAR(10),
              kyc_status VARCHAR(20),
              risk_rating VARCHAR(5),
              onboarding_date DATE,
              segment VARCHAR(20)
            );
            CREATE TABLE raw.account (
              account_id VARCHAR(20) PRIMARY KEY,
              customer_id VARCHAR(20),
              account_type VARCHAR(30),
              currency VARCHAR(10),
              branch_code VARCHAR(20),
              status VARCHAR(20),
              open_date DATE,
              close_date DATE
            );
            CREATE TABLE raw.transaction (
              transaction_id VARCHAR(20) PRIMARY KEY,
              account_id VARCHAR(20),
              transaction_date DATE,
              amount NUMERIC(18,2),
              currency VARCHAR(10),
              transaction_type VARCHAR(30),
              counterparty_id VARCHAR(20),
              description VARCHAR(200),
              channel VARCHAR(30)
            );
            CREATE TABLE raw.counterparty (
              counterparty_id VARCHAR(20) PRIMARY KEY,
              counterparty_name VARCHAR(200),
              counterparty_type VARCHAR(30),
              country_code VARCHAR(10),
              lei VARCHAR(30),
              is_sanctions_listed BOOLEAN,
              is_pep BOOLEAN
            );
            CREATE TABLE raw.market_data (
              instrument_id VARCHAR(30),
              valuation_date DATE,
              instrument_type VARCHAR(30),
              instrument_name VARCHAR(100),
              currency VARCHAR(10),
              mid_price NUMERIC(18,4),
              bid_price NUMERIC(18,4),
              ask_price NUMERIC(18,4)
            );
          "
          psql -h localhost -U dbt_user -d barclays_migration -c "\copy raw.customer FROM 'sample_data/customers.csv' WITH CSV HEADER"
          psql -h localhost -U dbt_user -d barclays_migration -c "\copy raw.account FROM 'sample_data/accounts.csv' WITH CSV HEADER"
          psql -h localhost -U dbt_user -d barclays_migration -c "\copy raw.transaction FROM 'sample_data/transactions.csv' WITH CSV HEADER"
          psql -h localhost -U dbt_user -d barclays_migration -c "\copy raw.counterparty FROM 'sample_data/counterparties.csv' WITH CSV HEADER"
          psql -h localhost -U dbt_user -d barclays_migration -c "\copy raw.market_data FROM 'sample_data/market_data.csv' WITH CSV HEADER"

      - name: Install dbt packages
        working-directory: ./dbt_project
        run: dbt deps

      - name: Load seed data
        working-directory: ./dbt_project
        run: dbt seed --full-refresh

      - name: Run dbt models
        working-directory: ./dbt_project
        run: dbt run

      - name: Run dbt tests
        working-directory: ./dbt_project
        run: dbt test

      - name: Generate documentation
        working-directory: ./dbt_project
        run: dbt docs generate
