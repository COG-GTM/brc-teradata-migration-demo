name: dbt CI

on:
  pull_request:
    paths:
      - 'dbt_project/**'
      - '.github/workflows/dbt_ci.yml'
  push:
    branches:
      - main
    paths:
      - 'dbt_project/**'

env:
  CI_DB_USER: dbt_user
  CI_DB_NAME: barclays_migration

jobs:
  dbt-build:
    name: dbt build & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ env.CI_DB_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_ephemeral' }}
          POSTGRES_DB: ${{ env.CI_DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-postgres dbt-core

      - name: Create profiles.yml for CI
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_ephemeral' }}
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          barclays_migration:
            target: postgres_local
            outputs:
              postgres_local:
                type: postgres
                host: localhost
                port: 5432
                user: ${CI_DB_USER}
                password: ${CI_DB_PASSWORD}
                dbname: ${CI_DB_NAME}
                schema: public
                threads: 4
          EOF

      - name: Create raw schema
        env:
          PGPASSWORD: ${{ secrets.CI_DB_PASSWORD || 'ci_only_ephemeral' }}
        run: |
          psql -h localhost -U $CI_DB_USER -d $CI_DB_NAME -c "CREATE SCHEMA IF NOT EXISTS raw;"

      - name: Install dbt packages
        working-directory: ./dbt_project
        run: dbt deps

      - name: Load seed data
        working-directory: ./dbt_project
        run: dbt seed

      - name: Run dbt models
        working-directory: ./dbt_project
        run: dbt run

      - name: Run dbt tests
        working-directory: ./dbt_project
        run: dbt test

      - name: Generate documentation
        working-directory: ./dbt_project
        run: dbt docs generate
