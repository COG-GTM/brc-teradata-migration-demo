name: 'barclays_migration'
version: '1.0.0'
config-version: 2
profile: 'barclays_migration'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  barclays_migration:
    staging:
      +materialized: view
      +schema: staging
      +tags: ['staging']
    intermediate:
      +materialized: ephemeral
      +tags: ['intermediate']
    marts:
      finance:
        +materialized: table
        +schema: finance
        +tags: ['finance', 'mart']
      risk:
        +materialized: table
        +schema: risk
        +tags: ['risk', 'mart']
      compliance:
        +materialized: table
        +schema: compliance
        +tags: ['compliance', 'mart']

seeds:
  barclays_migration:
    +schema: seeds
    raw_customers:
      +schema: raw
      +alias: customer
      +column_types:
        customer_id: varchar(10)
        date_of_birth: date
        onboarding_date: date
    raw_accounts:
      +schema: raw
      +alias: account
      +column_types:
        account_id: varchar(10)
        customer_id: varchar(10)
        open_date: date
        close_date: date
    raw_transactions:
      +schema: raw
      +alias: transaction
      +column_types:
        transaction_id: varchar(10)
        account_id: varchar(10)
        transaction_date: date
        amount: numeric(18,2)
        counterparty_id: varchar(10)
    raw_counterparties:
      +schema: raw
      +alias: counterparty
      +column_types:
        counterparty_id: varchar(10)
        is_sanctions_listed: boolean
        is_pep: boolean
    raw_market_data:
      +schema: raw
      +alias: market_data
      +column_types:
        valuation_date: date
        mid_price: numeric(18,8)
        bid_price: numeric(18,8)
        ask_price: numeric(18,8)

snapshots:
  barclays_migration:
    +target_schema: snapshots

vars:
  # Default business date for development/testing
  business_date: "current_date"
  # Toggle between Snowflake and Databricks syntax where needed
  target_platform: "snowflake"  # or "databricks"
