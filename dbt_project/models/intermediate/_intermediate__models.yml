version: 2

models:
  - name: int_daily_account_balances
    description: >
      Daily account balance snapshots computed from transaction data.
      Migrated from: teradata/stored_procedures/sp_daily_transaction_load.sql
      (balance calculation section).
      Replaces Teradata MERGE INTO with dbt incremental materialization.
      On Databricks this is a Delta table loaded with the `merge` incremental
      strategy and liquid clustering on (account_id, balance_date); on other
      platforms the adapter default incremental strategy applies.
    columns:
      - name: account_id
        tests:
          - not_null
      - name: balance_date
        tests:
          - not_null
      - name: closing_balance
        tests:
          - not_null
      - name: total_debits
        tests:
          - not_null
      - name: total_credits
        tests:
          - not_null

  - name: int_customer_risk_factors
    description: >
      Aggregated risk factors per customer for credit scoring.
      Migrated from: teradata/stored_procedures/sp_customer_risk_scoring.sql.
      Replaces Teradata VOLATILE TABLE, QUALIFY, ZEROIFNULL, and HASHROW.
      Date arithmetic uses dbt.datediff() and the hash bucket uses the
      teradata_compat hash_to_int_bucket() macro so the SQL is valid on
      Databricks as well as Snowflake and Postgres.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: derived_risk_rating
        tests:
          - not_null
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E']
      - name: risk_bucket
        tests:
          - not_null

  - name: int_transaction_enriched
    description: >
      Transactions enriched with account and counterparty details.
      Joins staging models to provide a denormalized transaction view.
      Ephemeral: inlined into downstream marts as a CTE, so concatenation uses
      dbt.concat() and CTE aliases are unique to stay Databricks-safe.
    columns:
      - name: transaction_id
        tests:
          - unique
          - not_null

  - name: int_aml_screening_flags
    description: >
      AML/sanctions screening flags derived from transaction patterns.
      Migrated from: teradata/stored_procedures/sp_aml_screening.sql.
      Replaces Teradata LIKE ANY, SOUNDEX, OREPLACE, OTRANSLATE,
      and VOLATILE TABLE patterns. UNION ALL branches are column-explicit and
      timestamps use dbt.current_timestamp() for Databricks compatibility.
    columns:
      - name: alert_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: alert_type
        tests:
          - not_null
          - accepted_values:
              values: ['SANCTIONS_MATCH', 'STRUCTURING', 'VELOCITY_BREACH', 'HIGH_RISK_COUNTRY']
      - name: alert_severity
        tests:
          - not_null
          - accepted_values:
              values: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']
