version: 2

sources:
  - name: barclays_raw
    description: >
      Raw landing zone tables migrated from the Teradata BARCLAYS_RAW database.
      These tables are loaded by upstream ETL processes (previously TPT/FastLoad/MultiLoad).
    database: "{{ env_var('DBT_RAW_DATABASE', 'barclays_migration') }}"
    schema: "{{ env_var('DBT_RAW_SCHEMA', 'raw') }}"
    loader: external_etl
    # loaded_at_field and freshness disabled for CI (seeds lack etl_loaded_ts)
    # Uncomment for production with real source tables:
    # loaded_at_field: etl_loaded_ts
    # freshness:
    #   warn_after: {count: 24, period: hour}
    #   error_after: {count: 48, period: hour}

    tables:
      - name: customer
        description: >
          Customer master data. Migrated from Teradata SET table BARCLAYS_RAW.CUSTOMER.
          Original PI: customer_id.
        columns:
          - name: customer_id
            description: Unique customer identifier
            tests:
              - unique
              - not_null
          - name: first_name
            description: Customer first name
          - name: last_name
            description: Customer last name
          - name: date_of_birth
            description: Customer date of birth
          - name: nationality
            description: ISO 2-letter country code
          - name: kyc_status
            description: "KYC verification status: VERIFIED, PENDING, EXPIRED, FAILED"
          - name: risk_rating
            description: "Customer risk rating: A (low) through E (high)"
          - name: onboarding_date
            description: Date customer was onboarded
          - name: segment
            description: "Customer segment: RETAIL, WEALTH, CORPORATE"

      - name: account
        description: >
          Account records. Migrated from Teradata MULTISET table BARCLAYS_RAW.ACCOUNT.
          Original PI: account_id, PPI: RANGE_N on open_date.
        columns:
          - name: account_id
            description: Unique account identifier
            tests:
              - unique
              - not_null
          - name: customer_id
            description: FK to customer table
            tests:
              - not_null
          - name: account_type
            description: "Type of account: CURRENT, SAVINGS, LOAN, MORTGAGE, CREDIT_CARD"
          - name: currency
            description: ISO currency code (GBP, EUR, USD)
          - name: branch_code
            description: Barclays branch sort code
          - name: status
            description: "Account status: ACTIVE, DORMANT, CLOSED, FROZEN"
          - name: open_date
            description: Date account was opened
          - name: close_date
            description: Date account was closed (null if still open)

      - name: transaction
        description: >
          Financial transactions. Migrated from Teradata MULTISET table BARCLAYS_RAW.TRANSACTION.
          Original PI: transaction_id, PPI: RANGE_N on transaction_date (monthly).
        columns:
          - name: transaction_id
            description: Unique transaction identifier
            tests:
              - unique
              - not_null
          - name: account_id
            description: FK to account table
            tests:
              - not_null
          - name: transaction_date
            description: Date of the transaction
          - name: amount
            description: Transaction amount (always positive; direction from transaction_type)
          - name: currency
            description: Transaction currency
          - name: transaction_type
            description: "Type: DEBIT, CREDIT, TRANSFER_IN, TRANSFER_OUT, FEE, INTEREST"
          - name: counterparty_id
            description: FK to counterparty table (nullable)
          - name: description
            description: Transaction narrative/description
          - name: channel
            description: "Originating channel: BRANCH, ONLINE, MOBILE, ATM, POS, BACS, CHAPS"

      - name: market_data
        description: >
          Market rates and prices. Migrated from BARCLAYS_RAW.MARKET_DATA.
          Original PI: (instrument_id, valuation_date).
        columns:
          - name: instrument_id
            description: Instrument/rate identifier
          - name: valuation_date
            description: Date of the valuation
          - name: instrument_type
            description: "Type: INTEREST_RATE, FX_RATE, EQUITY_INDEX, BOND_YIELD"
          - name: instrument_name
            description: Human-readable instrument name
          - name: currency
            description: Denomination currency
          - name: mid_price
            description: Mid-market price/rate
          - name: bid_price
            description: Bid price
          - name: ask_price
            description: Ask/offer price

      - name: counterparty
        description: >
          Counterparty reference data. Migrated from Teradata SET table BARCLAYS_RAW.COUNTERPARTY.
        columns:
          - name: counterparty_id
            description: Unique counterparty identifier
            tests:
              - unique
              - not_null
          - name: counterparty_name
            description: Legal entity name
          - name: counterparty_type
            description: "Type: BANK, CORPORATE, GOVERNMENT, INDIVIDUAL, MERCHANT"
          - name: country_code
            description: ISO 2-letter country code
          - name: lei
            description: Legal Entity Identifier (20 chars)
          - name: is_sanctions_listed
            description: Whether counterparty is on a sanctions list
          - name: is_pep
            description: Whether counterparty is a Politically Exposed Person
