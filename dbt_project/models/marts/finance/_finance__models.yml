version: 2

models:
  - name: fct_daily_transactions
    description: >
      Daily transaction fact table for finance reporting.
      Migrated from: teradata/ddl/04_warehouse_tables.sql (FCT_TRANSACTION).
    columns:
      - name: transaction_id
        description: Unique transaction identifier
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: transaction_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
      - name: transaction_type
        tests:
          - not_null
          - accepted_values:
              values: ['DEBIT', 'CREDIT', 'TRANSFER_IN', 'TRANSFER_OUT', 'FEE', 'INTEREST']
      - name: value_band
        tests:
          - accepted_values:
              values: ['MICRO', 'SMALL', 'MEDIUM', 'LARGE', 'VERY_LARGE']

  - name: fct_monthly_pnl
    description: >
      Monthly profit and loss aggregation by business line and product type.
      Migrated from: teradata/stored_procedures/sp_monthly_pnl_rollup.sql.
      Replaces Teradata GROUP BY ROLLUP and CSUM/MAVG OLAP functions.
    columns:
      - name: pnl_id
        tests:
          - unique
          - not_null
      - name: reporting_month
        tests:
          - not_null
      - name: business_line
        tests:
          - not_null
          - accepted_values:
              values: ['RETAIL_BANKING', 'LENDING', 'CARDS', 'OTHER']
      - name: gross_revenue
        tests:
          - not_null
      - name: net_revenue
        tests:
          - not_null

  - name: dim_accounts
    description: >
      Account dimension with current state.
      Migrated from: teradata/ddl/04_warehouse_tables.sql (DIM_ACCOUNT).
    columns:
      - name: account_id
        description: Unique account identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id
      - name: account_type
        tests:
          - accepted_values:
              values: ['CURRENT', 'SAVINGS', 'LOAN', 'MORTGAGE', 'CREDIT_CARD']
      - name: account_age_band
        tests:
          - accepted_values:
              values: ['NEW', 'ESTABLISHED', 'MATURE']
