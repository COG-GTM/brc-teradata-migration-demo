version: 2

models:
  - name: fct_daily_transactions
    description: >
      Daily transaction fact table for finance reporting.
      Migrated from: teradata/ddl/04_warehouse_tables.sql (FCT_TRANSACTION).
    columns:
      - name: transaction_id
        description: Unique transaction identifier
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: transaction_date
        tests:
          - not_null
      - name: amount
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0

  - name: fct_monthly_pnl
    description: >
      Monthly profit and loss aggregation by business line and product type.
      Migrated from: teradata/stored_procedures/sp_monthly_pnl_rollup.sql.
      Replaces Teradata GROUP BY ROLLUP, GROUPING(), CSUM, and MAVG.
    columns:
      - name: pnl_id
        tests:
          - unique
          - not_null
      - name: reporting_month
        tests:
          - not_null
      - name: rollup_level
        tests:
          - not_null
          - accepted_values:
              values: ['DETAIL', 'BUSINESS_LINE', 'TOTAL']

  - name: dim_accounts
    description: >
      Account dimension with current state.
      Migrated from: teradata/ddl/04_warehouse_tables.sql (DIM_ACCOUNT).
    columns:
      - name: account_id
        description: Unique account identifier
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id

  - name: dim_customers
    description: >
      Customer dimension with current state and derived attributes.
      Migrated from: teradata/ddl/04_warehouse_tables.sql (DIM_CUSTOMER).
      Replaces Teradata GENERATED ALWAYS AS IDENTITY and PERIOD(DATE).
    columns:
      - name: customer_sk
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: ['VERIFIED', 'PENDING', 'EXPIRED', 'FAILED']
      - name: segment
        tests:
          - accepted_values:
              values: ['RETAIL', 'WEALTH', 'CORPORATE']
      - name: lifecycle_band
        tests:
          - accepted_values:
              values: ['NEW', 'ESTABLISHED', 'LOYAL']

  - name: fct_daily_balances
    description: >
      Daily account balance snapshots with prior-day comparison.
      Migrated from: teradata/ddl/04_warehouse_tables.sql (FCT_DAILY_BALANCE)
      and teradata/macros/macro_account_balance_snapshot.sql.
      Replaces Teradata MERGE INTO with dbt incremental materialization.
    columns:
      - name: balance_sk
        tests:
          - unique
          - not_null
      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_accounts')
              field: account_id
      - name: balance_date
        tests:
          - not_null
