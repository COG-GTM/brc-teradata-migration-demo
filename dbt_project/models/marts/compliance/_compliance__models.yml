version: 2

models:
  - name: fct_aml_alerts
    description: >
      AML/sanctions screening alerts.
      Migrated from: teradata/stored_procedures/sp_aml_screening.sql
      and teradata/ddl/05_mart_tables.sql (MART_AML_ALERTS).
      Physical design on Databricks: Delta table, liquid clustering on
      (alert_date, customer_id), incremental merge on alert_id. Other targets
      use a dialect-neutral delete+insert incremental.
      alert_type / alert_severity are stored upper-cased and trimmed so
      sanctions / PEP reporting does not depend on engine collation
      (Databricks and Snowflake are case-sensitive; Teradata was not).
    columns:
      - name: alert_id
        tests:
          - unique
          - not_null
      - name: customer_id
        tests:
          - not_null
      - name: alert_type
        tests:
          - not_null
          - accepted_values:
              values: ['SANCTIONS_MATCH', 'STRUCTURING', 'VELOCITY_BREACH', 'HIGH_RISK_COUNTRY']
      - name: alert_severity
        tests:
          - accepted_values:
              values: ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW']
      - name: alert_status
        tests:
          - not_null
          - accepted_values:
              values: ['OPEN', 'CLOSED', 'UNDER_REVIEW']

  - name: fct_kyc_status
    description: >
      Customer KYC compliance status tracker.
      Tracks verification status and expiry for regulatory reporting.
      Physical design on Databricks: Delta table, liquid clustering on
      customer_id. Status, risk, segment and nationality codes are upper-cased
      and trimmed so EDD / high-risk-jurisdiction rules evaluate identically on
      Databricks, Snowflake and Postgres.
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: kyc_status
        tests:
          - not_null
          - accepted_values:
              values: ['VERIFIED', 'PENDING', 'EXPIRED', 'FAILED']
      - name: compliance_status
        tests:
          - not_null
          - accepted_values:
              values: ['COMPLIANT', 'IN_PROGRESS', 'OVERDUE', 'REMEDIATION_REQUIRED', 'UNKNOWN']
      - name: segment
        tests:
          - accepted_values:
              values: ['RETAIL', 'WEALTH', 'CORPORATE']
