# Docker Compose for local dbt development and testing.
# Provides a PostgreSQL database that mimics the target warehouse.
#
# Usage:
#   docker-compose up -d
#   cd dbt_project && dbt seed && dbt run && dbt test

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: barclays_migration_db
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: barclays_migration
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d barclays_migration"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: barclays_migration_adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
    driver: local
